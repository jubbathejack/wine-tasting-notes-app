<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Wine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .form-section h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        .required-label:after {
            content: "*";
            color: #dc3545;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">Add New Wine</h2>
                    </div>
                    
                    <div class="card-body">
                        <form method="POST">
                            <!-- Wine Basic Information -->
                            <div class="form-section">
                                <h3>Wine Information</h3>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label required-label">Wine Name</label>
                                        <input type="text" class="form-control" name="wine_name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label required-label">Winery</label>
                                        <input type="text" class="form-control" name="winery" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required-label">Country</label>
                                        <input type="text" class="form-control" name="country" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Region</label>
                                        <input type="text" class="form-control" name="region">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Sub-region</label>
                                        <input type="text" class="form-control" name="sub_region">
                                    </div>
                                </div>
                            </div>

                            <!-- Wine Characteristics -->
                            <div class="form-section">
                                <h3>Wine Characteristics</h3>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Vintage</label>
                                        <input type="number" class="form-control" name="vintage" 
                                               min="1900" max="{{ current_year }}" 
                                               placeholder="YYYY">
                                        <small class="form-text text-muted">Enter 4-digit year</small>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required-label">Color Style</label>
                                        <select class="form-select" name="color_style" required>
                                            <option value="">Choose...</option>
                                            <option>Red</option>
                                            <option>White</option>
                                            <option>Rosé</option>
                                            <option>Sparkling</option>
                                            <option>Dessert</option>
                                            <option>Fortified</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Grape Varieties</label>
                                        <input type="text" class="form-control" name="grape_variety" 
                                               placeholder="Comma separated list">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">ABV (%)</label>
                                        <input type="number" class="form-control" name="abv" 
                                               step="0.1" min="0" max="25">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Bottle Size (L)</label>
                                        <input type="number" class="form-control" name="bottle_size" 
                                               step="0.01" value="0.75">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Closure Type</label>
                                        <select class="form-select" name="closure_type">
                                            <option value="">Choose...</option>
                                            <option>Cork</option>
                                            <option>Screwcap</option>
                                            <option>Glass</option>
                                            <option>Synthetic</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Tasting Details -->
                            <div class="form-section">
                                <h3>Tasting Details</h3>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label required-label">Tasting Date</label>
                                        <input type="date" class="form-control" name="tasting_date" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required-label">Rating</label>
                                        <input type="number" class="form-control" name="rating" 
                                               min="0" max="100" required>
                                        <small class="form-text text-muted">0-100 scale</small>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Serving Temperature</label>
                                        <input type="text" class="form-control" name="serving_temperature" 
                                               placeholder="e.g., 12-14°C">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label required-label">Tasting Notes</label>
                                        <textarea class="form-control" name="tasting_notes" 
                                                  rows="4" required></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Food Pairing</label>
                                        <textarea class="form-control" name="food_pairing" 
                                                  rows="2"></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Aging Potential</label>
                                        <input type="text" class="form-control" name="aging_potential" 
                                               placeholder="e.g., 'Drink now' or 'Age 5-10 years'">
                                    </div>
                                </div>
                            </div>

                            <!-- Certifications -->
                            <div class="form-section">
                                <h3>Certifications</h3>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   name="organic" id="organic">
                                            <label class="form-check-label" for="organic">
                                                Organic Certification
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   name="biodynamic" id="biodynamic">
                                            <label class="form-check-label" for="biodynamic">
                                                Biodynamic Certification
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Form Actions -->
                            <div class="mt-4 d-flex justify-content-between">
                                <a href="/" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Save Wine
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
